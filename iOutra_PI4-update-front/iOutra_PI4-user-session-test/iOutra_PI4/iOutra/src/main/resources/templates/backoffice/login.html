<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href=" /img/icons/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>YOTRA - Backoffice Login</title>

</head>

<body class="bg-success">
        <div class="bg-success-subtle col-md-8 mx-auto rounded border p-2" style="margin-top: 3rem">
            <img src="/img/icons/horses.png" class="img-fluid" style="width: 100%; max-height: 200px; object-fit: cover;">
            <h2 class="text-center mb-5 mt-2">Yotra - Backoffice</h2>
            <p class="text-center">Essa tela é para acesso administrativo, para acesso à loja clique:   <a class="btn btn-secondary" href="/">Loja</a></p>

                <form th:action="@{/backoffice}" th:method="post" th:object="${usuario}">
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label">E-mail</label>
                        <div class="col-sm-8">
                        <input class="form-control" type="text" placeholder="Digite seu E-mail" th:field="*{email}" required>
                            </div>
                    </div>
                        <div class="row mb-3">
                            <label class="col-sm-4 col-form-label">Senha</label>
                            <div class="col-sm-8">
                            <input class="form-control" type="password" placeholder="Digite sua senha" th:field="*{password}">
                                </div>
                    </div>

                    <div class="row">
                        <div class="offset-sm-4 col-sm-4 d-grid">
                            <button class="btn btn-success" type="submit">Login</button>
                        </div>
                    </div>


                </form>
            <div th:if="${mensagem}" class="alert alert-danger" role="alert">
                <p th:text="${mensagem}"></p>
            </div>
        </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</html>
